# DavePaul77 news worker. Secrets (never in this file, the repo is public):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put TOPIC_NEWS_ALERT
#   npx wrangler secret put TOPIC_DAILY_OUTLOOK
#   npx wrangler secret put TOPIC_OTHER_NEWS   (medium/low impact; optional)
name = "dave-paul-77-news"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# https://dave-paul-77-news.davepaul77.workers.dev (GET /calendar); no preview URLs needed
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

# Created with: npx wrangler kv namespace create NEWS
[[kv_namespaces]]
binding = "NEWS"
id = "9d1b456960434d5c8ad5a28e9485e08c"

[vars]
# Pairs listed under an alert when one of their currencies has news.
PAIRS = "AUDJPY,AUDUSD,CADJPY,CHFJPY,EURGBP,EURJPY,EURNZD,EURUSD,GBPJPY,GBPUSD,NZDJPY,NZDUSD,USDCAD,USDCHF,USDJPY,XAUUSD"

[observability]
enabled = true
